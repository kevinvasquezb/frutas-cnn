<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutas en Vivo</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --borde: #2a2f3a; --texto: #e8eaf0; --tenue: #8b92a3;
    --verde: #22c55e; --rojo: #ef4444; --gris: #64748b; --acento: #f59e0b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: .3px; }
  header p { margin: 6px 0 0; color: var(--tenue); font-size: .95rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 20px;
         grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; padding: 16px; }
  .camara { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .guia { position: absolute; border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
          box-shadow: 0 0 0 9999px rgba(0,0,0,.35); transition: border-color .2s; pointer-events: none; }
  .inicio { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
            align-items: center; justify-content: center; text-align: center; padding: 16px; }
  button { background: var(--acento); color: #111; border: 0; border-radius: 999px; padding: 12px 26px;
           font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .veredicto { border-radius: 14px; padding: 22px 16px; text-align: center; background: var(--gris);
               transition: background .25s; }
  .veredicto .icono { font-size: 2.6rem; line-height: 1; }
  .veredicto .titulo { font-size: 1.6rem; font-weight: 800; margin-top: 8px; }
  .veredicto .detalle { margin-top: 6px; font-size: 1rem; opacity: .95; }
  .apta { background: var(--verde); color: #04260f; }
  .descartar { background: var(--rojo); color: #2b0606; }
  h2 { font-size: 1rem; color: var(--tenue); font-weight: 600; margin: 20px 0 10px; }
  .fila { display: grid; grid-template-columns: 9.5em 1fr 3.5em; align-items: center; gap: 10px; margin: 8px 0; }
  .barra { height: 12px; background: #262b36; border-radius: 99px; overflow: hidden; }
  .barra > div { height: 100%; background: var(--acento); border-radius: 99px; transition: width .2s; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--tenue); }
  .info { margin-top: 18px; color: var(--tenue); font-size: .85rem; line-height: 1.5; }
  .error { color: var(--rojo); }
  #foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .acciones { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .secundario { background: #262b36; color: var(--texto); border: 1px solid var(--borde); border-radius: 999px;
                padding: 10px 20px; font-size: .95rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🍎🍌🍊 Clasificador de Frutas en Vivo</h1>
  <p>Pon una fruta dentro del recuadro: el modelo decide al instante si está apta para venta.</p>
</header>

<main>
  <section class="card">
    <div class="camara" id="camara">
      <video id="video" playsinline muted></video>
      <img id="foto" alt="Foto subida" hidden>
      <div class="guia" id="guia" hidden></div>
      <div class="inicio" id="inicio">
        <div id="estado">Cargando modelo…</div>
        <button id="btn" disabled>Iniciar cámara</button>
      </div>
    </div>
    <div class="acciones">
      <label class="secundario" id="btnSubir">📁 Subir foto<input type="file" id="archivo" accept="image/*" hidden></label>
      <button class="secundario" id="btnCamara" hidden>📷 Volver a la cámara</button>
    </div>
  </section>

  <section class="card">
    <div class="veredicto" id="veredicto">
      <div class="icono" id="icono">🔍</div>
      <div class="titulo" id="titulo">Esperando cámara</div>
      <div class="detalle" id="detalle">&nbsp;</div>
    </div>
    <h2>Probabilidades (top 3)</h2>
    <div id="top"></div>
    <div class="info" id="info"></div>
  </section>
</main>

<canvas id="canvas" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
const UMBRAL = 0.60;        // Con menos confianza mostramos "acerca una fruta"
const SUAVIZADO = 0.45;     // Promedio móvil de las probabilidades (evita que el resultado "parpadee")
const FRACCION_RECUADRO = 0.8;  // Mismo recorte central que src/capturar.py

const $ = id => document.getElementById(id);
let session, config, entrada, probsSuaves = null;

async function cargar() {
  try {
    config = await (await fetch("../models/config.json")).json();
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
    session = await ort.InferenceSession.create("../models/" + config.onnx, { executionProviders: ["wasm"] });
    entrada = session.inputNames[0];
    $("estado").textContent = "Modelo listo (" + config.clases.length + " clases)";
    $("btn").disabled = false;
  } catch (e) {
    $("estado").innerHTML = '<span class="error">No se pudo cargar el modelo.</span><br>' +
      "Abre la página con <b>python web/servir.py</b> (no con doble clic).";
    console.error(e);
  }
}

async function iniciarCamara() {
  $("btn").disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    const video = $("video");
    video.srcObject = stream;
    await video.play();
    $("inicio").hidden = true;
    $("guia").hidden = false;
    ubicarGuia();
    bucle();
  } catch (e) {
    $("estado").innerHTML = '<span class="error">No se pudo abrir la cámara.</span><br>' +
      "Revisa el permiso del navegador y que ninguna otra app la esté usando.";
    $("btn").disabled = false;
  }
}

// Ubica el recuadro guía sobre el video (el video se muestra con object-fit: cover)
function ubicarGuia() {
  const v = $("video"), cont = $("camara").getBoundingClientRect();
  const escala = Math.max(cont.width / v.videoWidth, cont.height / v.videoHeight);
  const lado = Math.min(v.videoWidth, v.videoHeight) * FRACCION_RECUADRO * escala;
  Object.assign($("guia").style, { width: lado + "px", height: lado + "px",
    left: (cont.width - lado) / 2 + "px", top: (cont.height - lado) / 2 + "px" });
}
window.addEventListener("resize", () => { if (!$("guia").hidden) ubicarGuia(); });

// Imagen -> 224x224 -> tensor NCHW normalizado con mean/std del config (igual que el test).
// Cámara: recorte central cuadrado (el recuadro). Foto subida: la imagen entera, como Resize((224,224)) del test.
function preprocesar(fuente) {
  const S = config.img_size, c = $("canvas");
  c.width = S; c.height = S;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingQuality = "high";
  if (fuente instanceof HTMLVideoElement) {
    const lado = Math.min(fuente.videoWidth, fuente.videoHeight) * FRACCION_RECUADRO;
    ctx.drawImage(fuente, (fuente.videoWidth - lado) / 2, (fuente.videoHeight - lado) / 2, lado, lado, 0, 0, S, S);
  } else {
    ctx.drawImage(fuente, 0, 0, S, S);
  }
  const px = ctx.getImageData(0, 0, S, S).data, n = S * S, x = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    for (let k = 0; k < 3; k++) x[k * n + i] = (px[4 * i + k] / 255 - config.mean[k]) / config.std[k];
  }
  return new ort.Tensor("float32", x, [1, 3, S, S]);
}

function softmax(z) {
  const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0);
  return e.map(v => v / s);
}

async function clasificar(fuente) {
  const salida = await session.run({ [entrada]: preprocesar(fuente) });
  return softmax(Array.from(salida[session.outputNames[0]].data));
}

let modoFoto = false;  // true mientras se muestra una foto subida (la cámara se pausa)
async function bucle() {
  if (modoFoto) return;
  const t0 = performance.now();
  const probs = await clasificar($("video"));
  if (modoFoto) return;  // Se subió una foto mientras se procesaba este cuadro
  probsSuaves = probsSuaves ? probsSuaves.map((p, i) => SUAVIZADO * probs[i] + (1 - SUAVIZADO) * p) : probs;
  mostrar(probsSuaves, performance.now() - t0);
  requestAnimationFrame(bucle);
}

$("archivo").addEventListener("change", e => {
  const archivo = e.target.files[0];
  if (!archivo || !session) return;
  const img = $("foto");
  img.onload = async () => {
    modoFoto = true;
    $("inicio").hidden = true;
    $("guia").hidden = true;
    img.hidden = false;
    $("btnCamara").hidden = false;
    const t0 = performance.now();
    mostrar(await clasificar(img), performance.now() - t0);  // Una sola predicción, sin suavizado
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(archivo);
  e.target.value = "";  // Permite volver a elegir el mismo archivo
});

$("btnCamara").addEventListener("click", () => {
  modoFoto = false;
  probsSuaves = null;
  $("foto").hidden = true;
  $("btnCamara").hidden = true;
  if ($("video").srcObject) {
    $("guia").hidden = false;
    bucle();
  } else {
    $("inicio").hidden = false;
  }
});

function mostrar(probs, ms) {
  const orden = probs.map((p, i) => [p, i]).sort((a, b) => b[0] - a[0]);
  const [conf, iTop] = orden[0], clase = config.clases[iTop], nombre = config.nombres_es[clase];
  const v = $("veredicto");
  v.className = "veredicto";
  if (clase === "nada" || conf < UMBRAL) {
    $("icono").textContent = "🔍";
    $("titulo").textContent = "Acerca una fruta al recuadro";
    $("detalle").textContent = clase === "nada" ? "No se detecta fruta" : "El modelo no está seguro (" + Math.round(conf * 100) + "%)";
    $("guia").style.borderColor = "rgba(255,255,255,.85)";
  } else if (clase.startsWith("rotten")) {
    v.classList.add("descartar");
    $("icono").textContent = "❌";
    $("titulo").textContent = "Descartar (podrida)";
    $("detalle").textContent = nombre + " · " + Math.round(conf * 100) + "%";
    $("guia").style.borderColor = "var(--rojo)";
  } else {
    v.classList.add("apta");
    $("icono").textContent = "✅";
    $("titulo").textContent = "Apta para venta";
    $("detalle").textContent = nombre + " · " + Math.round(conf * 100) + "%";
    $("guia").style.borderColor = "var(--verde)";
  }
  const top = $("top");
  top.replaceChildren(...orden.slice(0, 3).map(([p, i]) => {
    const fila = document.createElement("div"); fila.className = "fila";
    const etiqueta = document.createElement("div"); etiqueta.textContent = config.nombres_es[config.clases[i]];
    const barra = document.createElement("div"); barra.className = "barra";
    const relleno = document.createElement("div"); relleno.style.width = (p * 100).toFixed(1) + "%";
    barra.appendChild(relleno);
    const pct = document.createElement("div"); pct.className = "pct"; pct.textContent = (p * 100).toFixed(0) + "%";
    fila.append(etiqueta, barra, pct);
    return fila;
  }));
  $("info").textContent = "Modelo: " + config.modelo + " · " + config.clases.length + " clases · " +
    ms.toFixed(0) + " ms por cuadro (~" + Math.round(1000 / Math.max(ms, 1)) + " cuadros/s) · corre 100% en tu navegador";
}

$("btn").addEventListener("click", iniciarCamara);
cargar();
</script>
</body>
</html>
